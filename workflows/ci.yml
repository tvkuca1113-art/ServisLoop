name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same branch cancels the first — no point paying for a run
# whose result is already stale.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      # No secrets are provided on purpose. The build must succeed with no Supabase
      # credentials at all — that is the guarantee that authenticated routes are never
      # prerendered and that no client is constructed at module scope. If someone breaks
      # that, this job is where it surfaces.
      - name: Build
        run: npm run build
