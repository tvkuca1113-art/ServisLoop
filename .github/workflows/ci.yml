name: CI

on:
  # Every branch, not just `main` — work pushed to a feature branch should be checked
  # while it is still cheap to fix, not only once it reaches the default branch.
  push:
  pull_request:
    branches: [main]

# Keyed on `head_ref` for pull requests and `ref` otherwise, so the run triggered by a
# push and the run triggered by opening a PR on that same branch land in one group and
# the older is cancelled. Without this, every PR would run the whole suite twice.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      # No secrets are provided on purpose. The build must succeed with no Supabase
      # credentials at all — that is the guarantee that authenticated routes are never
      # prerendered and that no client is constructed at module scope. If someone breaks
      # that, this job is where it surfaces.
      - name: Build
        run: npm run build
