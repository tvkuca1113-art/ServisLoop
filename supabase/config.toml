# Supabase CLI configuration for local development.
# Docs: https://supabase.com/docs/guides/local-development/cli/config
#
# `project_id` names the local Docker stack. Keeping it equal to the repository name
# means two checkouts of different projects can run side by side without their
# containers colliding.
project_id = "servisloop"

[api]
enabled = true
port = 54321
# Only `public` is exposed through PostgREST. `extensions` and `auth` stay private:
# pgcrypto's helpers and GoTrue's tables have no business being reachable over HTTP.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
# Ceiling on rows returned by an unpaginated request. A missing .limit() in the app
# then shows up as a truncated list in development rather than as a slow query in
# production.
max_rows = 1000

[db]
port = 54322
# Used by `supabase db diff` to materialise the schema from scratch and compare.
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

# Local mail catcher. Sign-up confirmations and magic links land here instead of
# being sent, so auth flows can be exercised offline.
[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = [
  "http://127.0.0.1:3000/auth/callback",
  "http://localhost:3000/auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Off locally so `supabase db reset` followed by a sign-up gives a usable session in
# one step. This must stay ON in any hosted environment.
enable_confirmations = false
